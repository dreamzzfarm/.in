<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DREAMZZ Shop | Farm Fresh</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header shop-header">

    <a class="logo" href="index.html">
        <span>D</span> DREAMZZ
    </a>

    <a href="index.html" class="back-home">
        ← Home
    </a>

    <div class="search-wrap">
        <span>⌕</span>
        <input
            id="searchInput"
            placeholder="Search DREAMZZ products..."
        >
    </div>

    <button class="icon-btn" id="wishlistBtn">
        ♡ <b id="wishCount">0</b>
    </button>

    <button class="cart-btn" id="cartBtn">
        🛒 Cart <b id="cartCount">0</b>
    </button>

</header>


<!-- SHOP HERO -->

<section class="shop-hero">

    <div>

        <p class="eyebrow">
            DREAMZZ MARKETPLACE
        </p>

        <h1>
            Fresh products.
            <br>
            <span>Delivered better.</span>
        </h1>

        <p>
            Shop farm-fresh dairy, fish and food products in one place.
        </p>

    </div>


    <div class="offer">

        🔥

        <strong>
            FRESH DEALS
        </strong>

        <small>
            Quality products. Great value.
        </small>

    </div>

</section>


<!-- SHOP AREA -->

<main class="shop-layout">


    <!-- FILTERS -->

    <aside class="filters">

        <h3>
            Filters
        </h3>


        <label>
            Category
        </label>


        <button
            class="filter active"
            data-cat="All"
        >
            All Products
        </button>


        <button
            class="filter"
            data-cat="Dairy"
        >
            🥛 Dairy
        </button>


        <button
            class="filter"
            data-cat="Fish"
        >
            🐟 Fish
        </button>


        <button
            class="filter"
            data-cat="Food"
        >
            🍯 Food
        </button>


        <button
            class="filter"
            data-cat="Fresh"
        >
            🌾 Fresh Farm
        </button>


        <hr>


        <label>
            Price
        </label>


        <input
            id="priceRange"
            type="range"
            min="50"
            max="1000"
            value="1000"
        >


        <div class="price-label">
            Up to ₹<span id="priceValue">1000</span>
        </div>


        <hr>


        <label>
            Minimum rating
        </label>


        <button
            class="rating-filter"
            data-rating="5"
        >
            ★★★★★
        </button>


        <button
            class="rating-filter"
            data-rating="4"
        >
            ★★★★☆ & up
        </button>


        <button
            class="rating-filter"
            data-rating="3"
        >
            ★★★☆☆ & up
        </button>

    </aside>



    <!-- PRODUCTS -->

    <section class="shop-content">


        <div class="shop-toolbar">

            <div>
                <b id="resultCount">0</b>
                products
            </div>


            <select id="sortSelect">

                <option value="featured">
                    Sort: Featured
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Top Rated
                </option>

            </select>

        </div>


        <div
            id="productGrid"
            class="product-grid"
        ></div>

    </section>

</main>



<!-- QUICK VIEW MODAL -->

<div
    id="quickModal"
    class="modal hidden"
>

    <div class="modal-card">

        <button
            class="modal-close"
            id="modalClose"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>



<!-- CART DRAWER -->

<div
    id="cartDrawer"
    class="drawer"
>


    <div class="drawer-head">

        <h2>
            Your Cart
        </h2>

        <button id="closeCart">
            ×
        </button>

    </div>


    <div id="cartItems"></div>


    <div class="cart-total">

        <span>
            Total
        </span>

        <strong>
            ₹<span id="cartTotal">0</span>
        </strong>

    </div>


    <!-- FIXED CHECKOUT BUTTON -->
<button class="checkout-btn" onclick="window.location.href='checkout.html'">
    Proceed to Checkout →
</button>

</div>



<!-- TOAST -->

<div id="toast"></div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>
</html>
