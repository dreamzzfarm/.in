<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMZZ Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap');:root{--g:#02462e;--gold:#fec700;--cream:#f7f5ed;--muted:#68736d}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:'DM Sans';color:#101412}.head{background:#fff;border-bottom:1px solid #e5e8e4;padding:17px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:21px}.logo span{display:inline-grid;place-items:center;background:var(--gold);color:var(--g);width:32px;height:32px;border-radius:9px;margin-right:6px}.head a{color:var(--g);font-weight:800;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:40px 5%}.ey{color:var(--g);font-size:11px;font-weight:800;letter-spacing:2px}.wrap h1{font:700 40px 'Playfair Display';margin:8px 0 25px}.card{background:#fff;border:1px solid #e5e8e4;border-radius:18px;padding:22px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5e8e4;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase}select,input{padding:9px;border:1px solid #ddd;border-radius:7px}button{background:var(--g);color:#fff;border:0;padding:9px 12px;border-radius:7px;font-weight:700;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px}</style></head><body><header class="head"><div class="logo"><span>D</span>DREAMZZ ADMIN</div><a href="account.html">Customer view</a></header><main class="wrap"><div class="ey">MILK DELIVERY CONTROL</div><h1>Customers & Subscriptions</h1><div class="card"><table><thead><tr><th>Customer</th><th>Phone/Email</th><th>Daily Milk</th><th>Active</th><th>Payment</th><th>Delivery</th><th>Renewal</th><th>Save</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none">No customers registered yet.</div></div></main><script>const key='dreamzzUsers';let users=JSON.parse(localStorage.getItem(key)||'[]');const rows=document.getElementById('rows'),empty=document.getElementById('empty');function render(){rows.innerHTML='';empty.style.display=users.length?'none':'block';users.forEach((u,i)=>{const m=u.milk||{};rows.innerHTML+=`<tr><td><strong>${u.name}</strong></td><td>${u.email}</td><td><input id="l${i}" type="number" min="0.25" step="0.25" value="${m.litres||1}" style="width:70px"> L</td><td><select id="a${i}"><option value="true" ${m.active?'selected':''}>ACTIVE</option><option value="false" ${!m.active?'selected':''}>INACTIVE</option></select></td><td><select id="p${i}"><option ${m.payment==='PAID'?'selected':''}>PAID</option><option ${m.payment!=='PAID'?'selected':''}>UNPAID</option></select></td><td><select id="d${i}"><option ${m.delivery==='Morning delivery'?'selected':''}>Morning delivery</option><option ${m.delivery==='Paused'?'selected':''}>Paused</option><option ${m.delivery==='Not started'?'selected':''}>Not started</option></select></td><td><input id="r${i}" type="date" value="${m.renewal||''}"></td><td><button onclick="save(${i})">Save</button></td></tr>`})}function save(i){users[i].milk=users[i].milk||{};users[i].milk.litres=Number(document.getElementById('l'+i).value)||1;users[i].milk.active=document.getElementById('a'+i).value==='true';users[i].milk.payment=document.getElementById('p'+i).value;users[i].milk.delivery=document.getElementById('d'+i).value;users[i].milk.renewal=document.getElementById('r'+i).value;users[i].milk.plan='Monthly';localStorage.setItem(key,JSON.stringify(users));alert('Customer status updated.')}render();</script></body></html>
