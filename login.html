<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DREAMZZ Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');

:root{
    --green:#02462e;
    --green2:#08734d;
    --gold:#fec700;
    --cream:#f7f5ed;
    --dark:#101412;
    --muted:#68736d;
    --white:#fff;
    --border:#e2e7e2;
    --red:#c62828;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'DM Sans',sans-serif;
    background:
        radial-gradient(circle at top right,#e8f3ec 0%,transparent 35%),
        var(--cream);
    color:var(--dark);
}

/* ================= HEADER ================= */

.header{
    height:75px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    text-decoration:none;
    font-size:22px;
    font-weight:800;
    color:var(--dark);
}

.logo span{
    display:inline-grid;
    place-items:center;
    width:35px;
    height:35px;
    background:var(--gold);
    color:var(--green);
    border-radius:10px;
    margin-right:7px;
}

.back{
    text-decoration:none;
    color:var(--green);
    font-weight:700;
    font-size:14px;
}

/* ================= PAGE ================= */

.page{
    min-height:calc(100vh - 75px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:45px 20px;
}

.login-card{
    width:100%;
    max-width:470px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    padding:35px;
    box-shadow:0 18px 50px rgba(2,70,46,.10);
}

/* ================= TITLE ================= */

.heading{
    text-align:center;
    margin-bottom:28px;
}

.heading .icon{
    width:62px;
    height:62px;
    margin:auto;
    display:grid;
    place-items:center;
    background:#e8f4ed;
    border-radius:18px;
    font-size:30px;
}

.heading h1{
    font:700 31px 'Playfair Display',serif;
    margin:16px 0 7px;
}

.heading p{
    margin:0;
    color:var(--muted);
    font-size:14px;
}

/* ================= TABS ================= */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#f1f4f1;
    border-radius:11px;
    padding:4px;
    margin-bottom:25px;
}

.tab{
    border:0;
    background:transparent;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-weight:800;
    color:var(--muted);
}

.tab.active{
    background:#fff;
    color:var(--green);
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

/* ================= FORM ================= */

.form{
    display:none;
}

.form.active{
    display:block;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

input{
    width:100%;
    border:1px solid var(--border);
    background:#fafcf9;
    padding:14px;
    border-radius:10px;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

input:focus{
    border-color:var(--green);
    background:#fff;
    box-shadow:0 0 0 3px rgba(2,70,46,.07);
}

.main-btn{
    width:100%;
    border:0;
    background:var(--green);
    color:#fff;
    padding:15px;
    border-radius:10px;
    font-family:inherit;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    margin-top:5px;
}

.main-btn:hover{
    background:var(--green2);
}

/* ================= SWITCH ================= */

.switch{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:var(--muted);
}

.switch button{
    border:0;
    background:none;
    color:var(--green);
    font-weight:800;
    cursor:pointer;
    font-family:inherit;
}

/* ================= ADMIN ================= */

.admin-box{
    background:#fff8d9;
    border:1px solid #f0d66b;
    border-radius:12px;
    padding:13px;
    margin-bottom:20px;
    font-size:12px;
    color:#665500;
}

.admin-title{
    font-weight:800;
    margin-bottom:4px;
}

.admin-login-btn{
    background:#101412;
}

.admin-login-btn:hover{
    background:#26302b;
}

.admin-back{
    text-align:center;
    margin-top:18px;
}

.admin-back button{
    border:0;
    background:none;
    color:var(--green);
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
}

/* ================= HIDDEN ================= */

.hidden{
    display:none !important;
}

/* ================= MOBILE ================= */

@media(max-width:550px){

    .header{
        padding:0 5%;
    }

    .back{
        font-size:12px;
    }

    .page{
        padding:25px 15px;
    }

    .login-card{
        padding:25px 20px;
    }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <a href="index.html" class="logo">
        <span>D</span>DREAMZZ
    </a>

    <a href="shop.html" class="back">
        ← Back to Shop
    </a>

</header>


<!-- ================= PAGE ================= -->

<main class="page">

<div class="login-card">

    <!-- TITLE -->

    <div class="heading">

        <div class="icon" id="headingIcon">
            👤
        </div>

        <h1 id="headingTitle">
            Welcome Back
        </h1>

        <p id="headingText">
            Login to your DREAMZZ account
        </p>

    </div>


    <!-- ================= LOGIN TYPE TABS ================= -->

    <div class="tabs">

        <button
            class="tab active"
            id="customerTab"
            onclick="showCustomerLogin()"
        >
            👤 Customer
        </button>

        <button
            class="tab"
            id="adminTab"
            onclick="showAdminLogin()"
        >
            🔐 Admin
        </button>

    </div>


    <!-- ================= CUSTOMER AREA ================= -->

    <div id="customerArea">

        <!-- CUSTOMER LOGIN -->

        <form
            class="form active"
            id="loginForm"
        >

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="main-btn"
            >
                Login
            </button>

        </form>


        <!-- CUSTOMER SIGNUP -->

        <form
            class="form"
            id="signupForm"
        >

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="your@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="main-btn"
            >
                Create Account
            </button>

        </form>


        <div class="switch" id="signupSwitch">

            Don't have an account?

            <button onclick="showSignup()">
                Create one
            </button>

        </div>


        <div
            class="switch hidden"
            id="loginSwitch"
        >

            Already have an account?

            <button onclick="showLogin()">
                Login
            </button>

        </div>

    </div>


    <!-- ================= ADMIN AREA ================= -->

    <div
        id="adminArea"
        class="hidden"
    >

        <div class="admin-box">

            <div class="admin-title">
                🔐 DREAMZZ Admin Access
            </div>

            Admin login is restricted to authorized
            DREAMZZ management accounts.

        </div>


        <form id="adminForm">

            <div class="form-group">

                <label>Admin Email</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="admin@dreamzz.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Admin Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="main-btn admin-login-btn"
            >
                🔐 Admin Login
            </button>

        </form>


        <div class="admin-back">

            <button onclick="showCustomerLogin()">
                ← Back to Customer Login
            </button>

        </div>

    </div>

</div>

</main>


<script>

/* =====================================================
   DREAMZZ LOGIN
===================================================== */


/* ================= CUSTOMER LOGIN ================= */

function showCustomerLogin(){

    document.getElementById("customerArea")
        .classList.remove("hidden");

    document.getElementById("adminArea")
        .classList.add("hidden");


    document.getElementById("customerTab")
        .classList.add("active");

    document.getElementById("adminTab")
        .classList.remove("active");


    document.getElementById("headingIcon")
        .textContent = "👤";

    document.getElementById("headingTitle")
        .textContent = "Welcome Back";

    document.getElementById("headingText")
        .textContent =
        "Login to your DREAMZZ account";

}


/* ================= ADMIN LOGIN ================= */

function showAdminLogin(){

    document.getElementById("customerArea")
        .classList.add("hidden");

    document.getElementById("adminArea")
        .classList.remove("hidden");


    document.getElementById("customerTab")
        .classList.remove("active");

    document.getElementById("adminTab")
        .classList.add("active");


    document.getElementById("headingIcon")
        .textContent = "🔐";

    document.getElementById("headingTitle")
        .textContent = "Admin Login";

    document.getElementById("headingText")
        .textContent =
        "Access the DREAMZZ management dashboard";

}


/* ================= SHOW SIGNUP ================= */

function showSignup(){

    document.getElementById("loginForm")
        .classList.remove("active");

    document.getElementById("signupForm")
        .classList.add("active");

    document.getElementById("signupSwitch")
        .classList.add("hidden");

    document.getElementById("loginSwitch")
        .classList.remove("hidden");

}


/* ================= SHOW LOGIN ================= */

function showLogin(){

    document.getElementById("signupForm")
        .classList.remove("active");

    document.getElementById("loginForm")
        .classList.add("active");

    document.getElementById("signupSwitch")
        .classList.remove("hidden");

    document.getElementById("loginSwitch")
        .classList.add("hidden");

}


/* =====================================================
   CUSTOMER LOGIN
===================================================== */

document.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const email =
        document.getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;


    const users =
        JSON.parse(
            localStorage.getItem("dreamzzUsers")
            || "[]"
        );


    const user =
        users.find(u =>
            String(u.email).toLowerCase() === email &&
            u.password === password
        );


    if(!user){

        alert(
            "Invalid email or password."
        );

        return;

    }


    localStorage.setItem(
        "dreamzzLoggedIn",
        "true"
    );


    localStorage.setItem(
        "dreamzzUser",
        JSON.stringify(user)
    );


    window.location.href =
        "account.html";

});


/* =====================================================
   CUSTOMER SIGNUP
===================================================== */

document.getElementById("signupForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const name =
        document.getElementById("signupName")
        .value
        .trim();

    const phone =
        document.getElementById("signupPhone")
        .value
        .trim();

    const email =
        document.getElementById("signupEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("signupPassword")
        .value;


    if(!/^[0-9]{10}$/.test(phone)){

        alert(
            "Please enter a valid 10 digit phone number."
        );

        return;

    }


    let users =
        JSON.parse(
            localStorage.getItem("dreamzzUsers")
            || "[]"
        );


    const exists =
        users.some(
            u =>
            String(u.email).toLowerCase() === email
        );


    if(exists){

        alert(
            "An account with this email already exists."
        );

        return;

    }


    const user = {

        id: Date.now(),

        name: name,

        phone: phone,

        email: email,

        password: password,

        address: "",

        city: "",

        pincode: "",

        state: "Kerala",

        country: "India"

    };


    users.push(user);


    localStorage.setItem(
        "dreamzzUsers",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "dreamzzLoggedIn",
        "true"
    );


    localStorage.setItem(
        "dreamzzUser",
        JSON.stringify(user)
    );


    alert(
        "Account created successfully!"
    );


    window.location.href =
        "account.html";

});


/* =====================================================
   ADMIN LOGIN
===================================================== */

/*
   DEMO ADMIN CREDENTIALS

   Email:
   admin@dreamzz.com

   Password:
   DREAMZZ@123
*/

document.getElementById("adminForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const email =
        document.getElementById("adminEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("adminPassword")
        .value;


    /* DEMO ADMIN ACCOUNT */

    const ADMIN_EMAIL =
        "admin@dreamzz.com";

    const ADMIN_PASSWORD =
        "DREAMZZ@123";


    if(
        email !== ADMIN_EMAIL ||
        password !== ADMIN_PASSWORD
    ){

        alert(
            "Invalid admin email or password."
        );

        return;

    }


    /* ADMIN LOGIN SESSION */

    localStorage.setItem(
        "dreamzzAdminLoggedIn",
        "true"
    );


    localStorage.setItem(
        "dreamzzAdmin",
        JSON.stringify({
            email: ADMIN_EMAIL,
            role: "admin"
        })
    );


    /* OPEN ADMIN DASHBOARD */

    window.location.href =
        "admin.html";

});


</script>

</body>
</html>
