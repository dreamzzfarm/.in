<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREAMZZ | Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');

:root{
    --green:#02462e;
    --green2:#08734d;
    --gold:#fec700;
    --cream:#f7f5ed;
    --dark:#101412;
    --muted:#68736d;
    --border:#e5e8e4;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'DM Sans',sans-serif;
    background:
        linear-gradient(120deg,rgba(2,70,46,.95),rgba(2,70,46,.75)),
        url("https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=1800&q=85")
        center/cover fixed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:460px;
    background:#fff;
    border-radius:24px;
    padding:38px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:800;
    margin-bottom:8px;
}

.logo span{
    display:inline-grid;
    place-items:center;
    width:38px;
    height:38px;
    background:var(--gold);
    color:var(--green);
    border-radius:11px;
    margin-right:7px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#f1f4f1;
    padding:4px;
    border-radius:10px;
    margin-bottom:25px;
}

.tab{
    border:0;
    background:transparent;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    color:var(--muted);
}

.tab.active{
    background:var(--green);
    color:#fff;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    font:inherit;
    background:#fafbf9;
}

input:focus{
    border-color:var(--green);
    background:#fff;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:50px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:18px;
}

.submit-btn{
    width:100%;
    border:0;
    background:var(--green);
    color:#fff;
    padding:15px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
    margin-top:5px;
}

.submit-btn:hover{
    background:var(--green2);
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    font-weight:600;
}

.message.error{
    display:block;
    background:#ffeded;
    color:#b42318;
}

.message.success{
    display:block;
    background:#eaf7ee;
    color:var(--green);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:13px;
}

.back:hover{
    color:var(--green);
}

.forgot{
    display:block;
    text-align:right;
    margin-top:-7px;
    margin-bottom:16px;
    font-size:12px;
    color:var(--green);
    font-weight:700;
    cursor:pointer;
}

@media(max-width:500px){

    .login-box{
        padding:28px 22px;
    }

}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <span>D</span>DREAMZZ
    </div>

    <div class="subtitle">
        Your farm. Your account. Your fresh deliveries.
    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            Login
        </button>

        <button
            class="tab"
            id="signupTab"
            onclick="showSignup()"
        >
            Create Account
        </button>

    </div>


    <div id="message" class="message"></div>


    <!-- ================= LOGIN ================= -->

    <form
        id="loginForm"
        class="form active"
        onsubmit="login(event)"
    >

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('loginPassword')"
                >
                    👁
                </button>

            </div>

        </div>


        <span
            class="forgot"
            onclick="forgotPassword()"
        >
            Forgot password?
        </span>


        <button
            type="submit"
            class="submit-btn"
        >
            Login →
        </button>

    </form>


    <!-- ================= SIGNUP ================= -->

    <form
        id="signupForm"
        class="form"
        onsubmit="signup(event)"
    >

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Your full name"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="tel"
                id="signupPhone"
                placeholder="10 digit mobile number"
                maxlength="10"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Your email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('signupPassword')"
                >
                    👁
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Create Account →
        </button>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back to DREAMZZ Home
    </a>

</div>


<script>

/* =====================================================
   DREAMZZ LOGIN SYSTEM
===================================================== */


/* ================= CHECK EXISTING LOGIN ================= */

if(
    localStorage.getItem("dreamzzLoggedIn") === "true"
){

    window.location.href = "account.html";

}


/* ================= USERS ================= */

let users =
    JSON.parse(
        localStorage.getItem("dreamzzUsers")
    ) || [];


/* ================= ELEMENTS ================= */

const loginForm =
    document.getElementById("loginForm");

const signupForm =
    document.getElementById("signupForm");

const loginTab =
    document.getElementById("loginTab");

const signupTab =
    document.getElementById("signupTab");

const message =
    document.getElementById("message");


/* ================= MESSAGE ================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ================= LOGIN TAB ================= */

function showLogin(){

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    message.className = "message";

}


/* ================= SIGNUP TAB ================= */

function showSignup(){

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    message.className = "message";

}


/* ================= SIGNUP ================= */

function signup(event){

    event.preventDefault();


    const name =
        document.getElementById("signupName")
        .value.trim();

    const phone =
        document.getElementById("signupPhone")
        .value.trim();

    const email =
        document.getElementById("signupEmail")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("signupPassword")
        .value;


    /* PHONE VALIDATION */

    if(!/^[0-9]{10}$/.test(phone)){

        showMessage(
            "Please enter a valid 10 digit phone number.",
            "error"
        );

        return;
    }


    /* CHECK EXISTING USER */

    const existing =
        users.find(
            user => user.email === email
        );


    if(existing){

        showMessage(
            "An account with this email already exists.",
            "error"
        );

        return;
    }


    /* CREATE USER */

  const user = {
    id: Date.now(),
    name: name,
    phone: phone,
    email: email,
    password: password,

    address: "",
    city: "",
    pincode: "",
    state: "Kerala",
    country: "India"
};

    users.push(user);


    localStorage.setItem(
        "dreamzzUsers",
        JSON.stringify(users)
    );


    /* AUTO LOGIN */

    localStorage.setItem(
        "dreamzzLoggedIn",
        "true"
    );

    localStorage.setItem(
        "dreamzzUser",
        JSON.stringify(user)
    );


    showMessage(
        "Account created successfully! Redirecting...",
        "success"
    );


    setTimeout(() => {

        window.location.href =
            "account.html";

    },700);

}


/* ================= LOGIN ================= */

function login(event){

    event.preventDefault();


    const email =
        document.getElementById("loginEmail")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;


    const user =
        users.find(
            u =>
                u.email === email &&
                u.password === password
        );


    if(!user){

        showMessage(
            "Incorrect email or password.",
            "error"
        );

        return;
    }


    /* SAVE LOGIN */

    localStorage.setItem(
        "dreamzzLoggedIn",
        "true"
    );

    localStorage.setItem(
        "dreamzzUser",
        JSON.stringify(user)
    );


    showMessage(
        "Login successful! Redirecting...",
        "success"
    );


    setTimeout(() => {

        window.location.href =
            "account.html";

    },500);

}


/* ================= PASSWORD ================= */

function togglePassword(id){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}


/* ================= FORGOT PASSWORD ================= */

function forgotPassword(){

    alert(
        "For the demo version, password reset is not connected yet. Real email/password recovery will be added with the secure backend."
    );

}

</script>

</body>
</html>
